{% extends "base.html" %}
{% block content %}
<h2>Library Catalogue</h2>
<table>
    <tr><th>ID</th><th>Title</th><th>Price</th><th>Year</th><th>Author</th><th>Publisher</th><th>Category</th></tr>
    {% for b in books %}
    <tr><td>{{ b.book_id }}</td><td>{{ b.title }}</td><td>${{ b.price }}</td><td>{{ b.publish_year }}</td><td>{{ b.author_name }}</td><td>{{ b.publisher_name }}</td><td>{{ b.category_name }}</td></tr>
    {% endfor %}
</table>
{% endblock %}
